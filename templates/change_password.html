<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير كلمة المرور - منصة التسميع القرآني</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #071913 0%, #0f382c 50%, #174d3d 100%);
            --accent-gold: #d4af37;
            --card-bg: rgba(18, 42, 34, 0.85);
            --border-color: rgba(212, 175, 55, 0.3);
            --text-light: #f9f8f3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Amiri', serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-light);
        }
        .auth-box {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 20px rgba(212, 175, 55, 0.15);
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        h2 {
            font-size: 24px;
            color: var(--accent-gold);
            margin-bottom: 12px;
        }
        p { font-size: 15px; opacity: 0.85; margin-bottom: 25px; line-height: 1.6; }
        input {
            display: block;
            width: 100%;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            color: #071913;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
        <h2>تحديث كلمة المرور لسرية حسابك</h2>
        <p>نظرًا لأن هذا هو دخولك الأول للمنصة، يرجى إنشاء كلمة مرور جديدة خاصة بك لتأمين الحساب.</p>
        <form method="POST" action="/change_password">
            <input type="password" name="new_password" placeholder="أدخل كلمة المرور الجديدة" required minlength="6">
            <button type="submit">تحديث كلمة المرور</button>
        </form>
    </div>
</body>
</html>
